name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cmake:
    name: ${{ matrix.cc }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mode: [plain, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DSRMS_SANITIZERS=${{ matrix.mode == 'sanitizers' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  makefile:
    name: make ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make CC=${{ matrix.cc }} test

  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc && cmake --build build -j
      - name: Run
        run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./build/srms_tests
