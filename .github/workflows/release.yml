name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Package
        run: |
          mkdir -p dist
          cp build/srms dist/srms-linux-amd64
          tar -czf "dist/student-record-system-${GITHUB_REF_NAME}.tar.gz" \
            --exclude dist --exclude .git --exclude build .
          (cd dist && sha256sum srms-linux-amd64 "student-record-system-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS)
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
